[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "road-damage-dg"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["Pillow==12.2.0", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
rdd-prepare = "rdd.data.prepare:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
